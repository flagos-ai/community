# FlagOS people — identity & affiliation tables.
#
# people: entity table, PK = github id (canonical).
#   - name  : display name
#   - emails: git-history join key (array; one person, several addresses)
#   - affiliations: open-ended `{unit}` by default — leavers keep `{unit: baai}`
#     here (they usually stop contributing, so no departure date is recorded).
#     When a leaver later contributes under a new org, add a new affiliation
#     `{unit: X, from: <date their new-org contributions begin>}` and close the
#     prior one with `to:` at that same date; non-overlapping bands keep history
#     exact (pre-date commits → old unit, post-date → new unit).
# units: affiliation targets; `domains` is a corporate-domain fallback so
#   people on that domain need no explicit listing.
# Governance (sigs, projects) references people by github id as a foreign key.
units:
  - id: baai
    name: BAAI
    domains: [baai.ac.cn]

