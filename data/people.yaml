# FlagOS people — identity & affiliation tables.
#
# people: entity table, PK = github id (canonical).
#   - name  : display name
#   - emails: git-history join key (array; one person, several addresses)
#   - affiliations: open-ended `{org}` by default — leavers keep `{org: baai}`
#     here (they usually stop contributing, so no departure date is recorded).
#     When a leaver later contributes under a new org, add a new affiliation
#     `{org: X, from: <date their new-org contributions begin>}` and close the
#     prior one with `to:` at that same date; non-overlapping bands keep history
#     exact (pre-date commits → old org, post-date → new org).
# orgs: affiliation targets; `domains` is a corporate-domain fallback so
#   people on that domain need no explicit listing.
# Governance (sigs, projects) references people by github id as a foreign key.
orgs:
  - id: baai
    name: BAAI
    domains: [baai.ac.cn]
  - id: metax
    name: MetaX
    domains: [metax-tech.com]
  - id: cambricon
    name: Cambricon
    domains: [cambricon.com, internal.cambricon.com]
  - id: tsingmicro
    name: TsingMicro
    domains: [tsingmicro.com]
  - id: enflame
    name: Enflame
    domains: [enflame-tech.com]
  - id: iluvatar
    name: Iluvatar
    domains: [iluvatar.com]
  - id: mthreads
    name: Moore Threads
    domains: [mthreads.com]
  - id: kunlunxin
    name: Kunlunxin
    domains: [kunlunxin.com]

