# =============================================================================
# FlagOS 2.2 — Official release source repository manifest (vcstool format)
# =============================================================================
# Purpose: fetch the source of all modules at the FlagOS 2.2 official release
# Usage:
#   pip install vcstool
#   mkdir flagos-2.2 && cd flagos-2.2
#   vcs import src < release-2.2.yaml
#
# Release policy (six-library correction: 2026-09-29):
#   - version names the official release tag. flagtree-cpu uses its independent
#     release series at v0.1.0.
#   - FlagFFT, FlagSparse, FlagDNN, FlagBLAS, FlagTensor and FlagAttention use
#     the last primary-branch commit strictly before 2026-09-28 09:00:00
#     Asia/Shanghai (2026-09-28T01:00:00Z), following first-parent history.
#     Their source branch is main, or master for FlagDNN and FlagBLAS.
#   - For these six libraries, target-commit records the corrected official
#     tag commit; release-source is primary-branch-cutoff.
#   - FlagGems, FlagGems-vllm and FlagGems-sglang keep their existing tags.
#     Other entries retain their previous review snapshots.
#   - rc2 is the historical RC2 baseline and may differ from the release source.
#   - tag-status: existing = tag matched target-commit when that entry was
#     reviewed; pending = official tag was absent. Comments are review snapshots.
#   - This manifest does not certify test results or artifact availability.
#     vcs import requires every version tag to exist.
#
# Naming:
#   - Official tag: v{X}.{Y}.{Z} (e.g. v0.2.0), including flagtree-cpu.
#     FlagTree GPU variants keep the upstream local-version format
#     (e.g. 0.7.0+triton3.6, no v prefix).
# =============================================================================

