# =============================================================================
# FlagOS 2.2 — Official release source repository manifest (vcstool format)
# =============================================================================
# Purpose: fetch the source of all modules at the FlagOS 2.2 official release
# Usage:
#   pip install vcstool
#   mkdir flagos-2.2 && cd flagos-2.2
#   vcs import src < release-2.2.yaml
#
# Versioning and tag targets (review snapshot: 2026-09-28):
#   - version is the official release tag, normally with the rc/post suffix
#     removed. flagtree-cpu starts its independent release series at v0.1.0.
#   - target-commit records the exact commit proposed for each official tag.
#   - L1 operator libraries except FlagGems use the last first-parent commit on
#     source-branch at or before 2026-09-28 09:00:00 Asia/Shanghai (01:00:00 UTC),
#     selected by committer timestamp. master is used where main does not exist.
#   - FlagGems and FlagCX retain their captured RC2 branch HEADs.
#     rc2 records the RC2 manifest baseline, which may differ from the target.
#   - flagtree-cpu uses the captured HEAD of source-branch: triton_v3.7.x.
#   - Other entries retain existing official tags, or use the snapshot pinned
#     in release-2.2-rc2.yaml when the official tag does not yet exist.
#   - tag-status: existing = official tag matches target-commit; pending = tag
#     does not exist; existing-target-mismatch = tag exists at another commit,
#     recorded as existing-tag-commit. These conflicts need a tag/version decision.
#   - Tag operations remain deferred until this manifest is confirmed.
#   - This manifest does not certify test results or artifact availability.
#     vcs import reproduces the selected sources only once every version tag
#     resolves to its target-commit.
#
# Naming:
#   - Official tag: v{X}.{Y}.{Z} (e.g. v0.2.0), including flagtree-cpu.
#     FlagTree GPU variants keep the upstream local-version format
#     (e.g. 0.7.0+triton3.6, no v prefix).
# =============================================================================

