# =============================================================================
# FlagOS 2.2 — Official release source repository manifest (vcstool format)
# =============================================================================
# Purpose: fetch the source of all modules at the FlagOS 2.2 official release
# Usage:
#   pip install vcstool
#   mkdir flagos-2.2 && cd flagos-2.2
#   vcs import src < release-2.2.yaml
#
# Release policy (review snapshot: 2026-09-28):
#   - version names the official release tag. flagtree-cpu uses its independent
#     release series at v0.1.0.
#   - GitHub Releases use the existing official tags at their current commits;
#     already-created Releases are preserved. This pass does not create or move tags.
#   - FlagTree GPU variants and flagtree-cpu are excluded from this publication
#     pass; their entries retain the previous review snapshot.
#   - For other entries with an existing tag, target-commit records its observed
#     commit and release-source is existing-tag. This supersedes earlier proposed
#     RC2/main-cutoff targets for those entries.
#   - Entries without an official tag retain their previously proposed
#     target-commit and remain pending until that tag is available.
#   - rc2 is the historical RC2 baseline and may differ from the release source.
#   - tag-status: existing = tag matched target-commit when reviewed;
#     pending = official tag was absent. Comments are a review snapshot.
#   - This manifest does not certify test results or artifact availability.
#     vcs import requires every version tag to exist.
#
# Naming:
#   - Official tag: v{X}.{Y}.{Z} (e.g. v0.2.0), including flagtree-cpu.
#     FlagTree GPU variants keep the upstream local-version format
#     (e.g. 0.7.0+triton3.6, no v prefix).
# =============================================================================

