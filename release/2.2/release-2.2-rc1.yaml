    # 分支: 0.1.0-rc1
    # rc0: v0.1.0-rc0.post1 / 默认分支: master ← 注意：不是 main

  # ===========================================================================
  # L2 — 框架适配层（PyTorch 插件 + 训练/推理框架 + 量化）
  # ===========================================================================

  torch-fl:
    type: git
