    # 分支: 0.2.0-rc1
    # rc0: v0.2.0-rc0.post1 / 默认分支: main

  # vllm-plugin-FL 按 vLLM 版本线拆两个条目，指向同一仓库的不同分支，2.2 两条线都测：
  #   - main        跟 vLLM 0.24.0 → 0.3.0-rc1
