# =============================================================================
# FlagOS 2.2 RC1 — 源码仓库清单（vcstool 格式）
# =============================================================================
# 用途：批量拉取所有模块的 rc1 已验证快照
# 用法：
#   pip install vcstool
#   mkdir flagos-2.2-rc1 && cd flagos-2.2-rc1
#   vcs import src < release-2.2-rc1.yaml
#
# version / 分支 / tag 关系：
#   - version 字段指向当前已验证的 tag（其他用户拉取锁定版本）
#   - 注释中的"分支"是开发集成线，修复在上面累积
#   - 每次验证通过后打递增 tag（rc1.post1 → rc1.post2 → ...），并更新 version
#
#   工作流：
#     git checkout -b 0.14.0-rc1            # 拉 rc1 分支（一次）
#     git push origin 0.14.0-rc1
#     ... 修复 ...
#     git tag v0.14.0-rc1.post1              # 第一轮验证
#     git push origin v0.14.0-rc1.post1
#     # manifest: version: v0.14.0-rc1.post1 ← 更新
#     ... 修复 ...
#     git tag v0.14.0-rc1.post2              # 第二轮验证
#     # manifest: version: v0.14.0-rc1.post2 ← 更新
#
# 命名规则（详见 ../README_CN.md §1）：
#   - 分支: 不带 v 前缀、不带 release/ 前缀，例如 0.14.0-rc1
#   - tag:  带 v 前缀 + .postN 迭代后缀，例如 v0.14.0-rc1.post1
#   - 模块版本号与 rc0 一致；各条目"rc0:"注释记录上一轮已验证 tag
#
# 注释字段说明（manage-release.py 依赖这两个字段）：
#   - "分支:"     rc1 集成分支名，工具会创建并推送它
#   - "基线分支:" rc1 分支从哪个上游分支拉出；缺省时取默认分支。
#                同一仓库拆多个条目、各自跟不同上游线时必须写（见 FlagTree、
#                vllm-plugin-fl）；rc 分支要从发布分支而非默认分支拉出时也必须写
#                （见 flagos-compressor）
#
# ⚠️ 注意: FlagGems / FlagGems-sglang / FlagDNN / FlagBLAS 的默认分支是 master，
#          其他模块都是 main。
# =============================================================================

repositories:

  # ===========================================================================
  # L0 — 基础设施层（编译底座 + 通信库）
  # ===========================================================================

  # FlagTree 按 Triton 版本拆多个条目，指向同一仓库的不同分支。
  # 2.2 只关注三个：3.6（即 main）、3.5、3.3。
  #
  # ⚠️ FlagTree tag 格式例外：本仓库近期 tag 一律不带 v 前缀、rc 不带连字符，
  #    上游既有格式为 0.6.0+triton3.6、0.7.0rc0.post1+triton3.6（已核实）。
  #    因此这三条不套用 README 的 v{X}-rcN.postN 规则，沿用上游写法。
  flagtree-triton3.6:
    type: git
    url: https://github.com/flagos-ai/FlagTree.git
    version: 0.7.0rc1.post1+triton3.6
    # 分支: 0.7.0-rc1-triton3.6
    # 基线分支: main
    # rc0: 0.7.0rc0.post1+triton3.6 / 默认分支: main

  flagtree-triton3.5:
    type: git
    url: https://github.com/flagos-ai/FlagTree.git
    version: 0.7.0rc1.post1+triton3.5
    # 分支: 0.7.0-rc1-triton3.5
    # 基线分支: triton_v3.5.x
    # rc0: 0.7.0rc0.post1+triton3.5 / 默认分支: main

  flagtree-triton3.3:
    type: git
    url: https://github.com/flagos-ai/FlagTree.git
    version: 0.7.0rc1.post1+triton3.3
    # 分支: 0.7.0-rc1-triton3.3
    # 基线分支: triton_v3.3.x
    # rc0: 0.7.0rc0.post1+triton3.3 / 默认分支: main

  flagcx:
    type: git
    url: https://github.com/flagos-ai/flagcx.git
    version: v0.14.0-rc1.post1
    # 分支: 0.14.0-rc1
    # rc0: v0.14.0-rc0.post1 / 默认分支: main

  # ===========================================================================
  # L1 — 计算库层（核心算子 + 领域算子）
  # ===========================================================================

  flaggems:
