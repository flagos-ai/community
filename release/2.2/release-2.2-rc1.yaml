    # 分支: 5.4.0-rc1
    # rc0: v5.4.0-rc0.post1 / 默认分支: master ← 注意：不是 main
    # 注: master 已合入 setuptools_scm 改为 only-version（#5885），post tag 落在
    #     master 历史上不再触发构建失败，rc1 无需再做 rc0 那次的 cherry-pick/挪 tag

  flagfft:
    type: git
    url: https://github.com/flagos-ai/FlagFFT.git
