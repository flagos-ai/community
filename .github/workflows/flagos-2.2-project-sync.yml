name: Sync FlagOS 2.2 issues to release quality project

on:
  schedule:
    # Run every 15 minutes so new RC issues and Project status changes settle
    # into the shared views without requiring a manual refresh.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagos-2.2-project-sync
  cancel-in-progress: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Use the repository-scoped token. The default GITHUB_TOKEN and the
      # legacy organization token do not have the Projects scope required by
      # this workflow.
      GH_TOKEN: ${{ secrets.FLAGOS_PROJECT_TOKEN }}
      PROJECT_NUMBER: "9"
      PROJECT_OWNER: flagos-ai

    steps:
      - name: Validate GitHub Project access
        shell: bash
        run: |
          set -euo pipefail
          if ! gh project view "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json --jq '.id' > /dev/null; then
            echo "::error::The Actions token needs GitHub Projects access. Configure FLAGOS_PROJECT_TOKEN with project scope."
            exit 1
          fi

      - name: Add or restore RC issues in the project
        shell: bash
        run: |
          set -euo pipefail

          all_issues="$RUNNER_TEMP/flagos-2.2-issues.txt"
          project_items="$RUNNER_TEMP/flagos-2.2-project-items.json"
          known_project_issues="$RUNNER_TEMP/flagos-2.2-known-project-issues.txt"
          archived_project_issues="$RUNNER_TEMP/flagos-2.2-archived-project-issues.tsv"
          missing_issues="$RUNNER_TEMP/missing-issues.txt"
          : > "$all_issues"

          for label in flagos2.2-rc0 flagos2.2-rc1 flagos2.2-rc2; do
            for state in open closed; do
              gh search issues \
                --owner "$PROJECT_OWNER" \
                --label "$label" \
                --state "$state" \
                --limit 1000 \
                --json url \
                --jq '.[].url' >> "$all_issues"
            done
          done

          sort -u -o "$all_issues" "$all_issues"

          project_query='query($owner:String!,$number:Int!,$endCursor:String){organization(login:$owner){projectV2(number:$number){items(first:100,after:$endCursor,archivedStates:[ARCHIVED,NOT_ARCHIVED]){nodes{id isArchived content{__typename ... on Issue{url labels(first:50){nodes{name}}}}} pageInfo{hasNextPage endCursor}}}}}'
          gh api graphql --paginate --slurp -f query="$project_query" \
            -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" > "$project_items"

          # During the active 2.2 release cycle, Project membership is
          # append-only. Keep every existing item visible and restore any
          # archived issue that still carries an RC0/RC1/RC2 label. In
          # particular, never treat one incomplete GitHub Search response as
          # evidence that an existing item should be archived.
          jq -r '
            .[] | .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue")
            | select(
                .isArchived == false
                or ([.content.labels.nodes[].name]
                    | any(. == "flagos2.2-rc0"
                          or . == "flagos2.2-rc1"
                          or . == "flagos2.2-rc2")))
            | .content.url' "$project_items" | sort -u > "$known_project_issues"
          jq -r '
            .[] | .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue" and .isArchived == true)
            | select([.content.labels.nodes[].name]
                     | any(. == "flagos2.2-rc0"
                           or . == "flagos2.2-rc1"
                           or . == "flagos2.2-rc2"))
            | [.content.url, .id] | @tsv' "$project_items" \
            | sort -u > "$archived_project_issues"

          reactivated=0
          while IFS=$'\t' read -r issue_url item_id; do
            [ -n "$item_id" ] || continue
            gh project item-archive "$PROJECT_NUMBER" \
              --owner "$PROJECT_OWNER" --id "$item_id" --undo > /dev/null
            reactivated=$((reactivated + 1))
          done < "$archived_project_issues"

          comm -23 "$all_issues" "$known_project_issues" > "$missing_issues"

          added=0
          while IFS= read -r issue_url; do
            [ -n "$issue_url" ] || continue
            gh project item-add "$PROJECT_NUMBER" \
              --owner "$PROJECT_OWNER" \
              --url "$issue_url" > /dev/null
            added=$((added + 1))
          done < "$missing_issues"

          echo "Matched $(wc -l < "$all_issues" | tr -d ' ') issues; added $added; reactivated $reactivated; automatic archiving disabled during the 2.2 release cycle."

      - name: Reconcile deterministic project status
        shell: bash
        run: |
          set -euo pipefail

          project_id=$(gh project view "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json --jq '.id')
          status_field_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .id')
          triage_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Triage") | .id')
          confirmed_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Confirmed") | .id')
          fixing_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Fixing") | .id')
          verification_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Verification") | .id')
          done_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id')
          deferred_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Deferred") | .id')
          priority_field_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Priority") | .id')
          priority_p0_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Priority") | .options[] | select(.name == "P0") | .id')
          priority_p1_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Priority") | .options[] | select(.name == "P1") | .id')
          priority_p2_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Priority") | .options[] | select(.name == "P2") | .id')

          query='query($owner:String!,$number:Int!,$endCursor:String){organization(login:$owner){projectV2(number:$number){items(first:100,after:$endCursor){nodes{id content{__typename ... on Issue{number state stateReason labels(first:50){nodes{name}} assignees(first:20){nodes{login}} closedByPullRequestsReferences(first:50,includeClosedPrs:true){nodes{state mergedAt baseRefName}}}} fieldValues(first:50){nodes{... on ProjectV2ItemFieldSingleSelectValue{name field{... on ProjectV2SingleSelectField{name}}} ... on ProjectV2ItemFieldPullRequestValue{pullRequests(first:50){nodes{state mergedAt baseRefName}} field{... on ProjectV2Field{name}}}}}} pageInfo{hasNextPage endCursor}}}}}'
          project_items="$RUNNER_TEMP/flagos-2.2-project-items.json"
          transitions="$RUNNER_TEMP/flagos-2.2-status-transitions.tsv"
          priority_transitions="$RUNNER_TEMP/flagos-2.2-priority-transitions.tsv"
          gh api graphql --paginate --slurp -f query="$query" \
            -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" > "$project_items"

          jq -r \
            '.[] | .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue")
            | {id, number: .content.number, state: .content.state,
               reason: .content.stateReason,
               labels: [.content.labels.nodes[].name],
               assignees: [.content.assignees.nodes[].login],
               pull_requests: ([.content.closedByPullRequestsReferences.nodes[]]
                 + [.fieldValues.nodes[]
                    | select(.field.name == "Linked pull requests")
                    | .pullRequests.nodes[]]
                 | unique),
               status: ([.fieldValues.nodes[]
                         | select(.field.name == "Status") | .name][0] // "UNSET")}
            | (.desired = (
                if .state == "CLOSED" and .reason == "NOT_PLANNED" then "Deferred"
                # GitHub can return a null reason for older closed issues.
                # Closed is nevertheless a completed quality item unless it
                # was explicitly closed as not planned.
                elif .state == "CLOSED" then "Done"
                elif .state == "OPEN" and .reason == "REOPENED" then
                  (if (.assignees | length) == 0 then "Triage" else "Confirmed" end)
                elif .state == "OPEN" and .status == "Deferred" then "Deferred"
                elif .state == "OPEN" and .status == "Verification" then "Verification"
                # A merged PR only means Verification when it landed on an
                # RC branch. A merge to main is still Fixing for 2.2.
                elif .state == "OPEN" and ([.pull_requests[]
                  | select(.state == "MERGED" and ((.baseRefName // "") | test("(^|[-_/])rc[0-2]($|[-_/.])"; "i")))] | length) > 0 then "Verification"
                elif .state == "OPEN" and ([.pull_requests[]
                  | select(.state == "OPEN" or .state == "MERGED")] | length) > 0 then "Fixing"
                elif .state == "OPEN" and (.assignees | length) == 0 then "Triage"
                elif .state == "OPEN" and .status == "Triage" and (.assignees | length) > 0 then "Confirmed"
                elif .state == "OPEN" and .status == "UNSET" then "Confirmed"
                else .status
                end))
            | select(.desired != .status)
            | [.id, .number, .status, .desired] | @tsv' \
            "$project_items" > "$transitions"

          jq -r \
            '.[] | .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue")
            | {id, number: .content.number,
               labels: [.content.labels.nodes[].name],
               priority: ([.fieldValues.nodes[]
                            | select(.field.name == "Priority") | .name][0] // "UNSET")}
            | (.desired_priority = (
                if (.labels | index("P0")) != null then "P0"
                elif (.labels | index("P1")) != null then "P1"
                elif (.labels | index("P2")) != null then "P2"
                else "UNSET"
                end))
            | select(.desired_priority != .priority)
            | [.id, .number, .priority, .desired_priority] | @tsv' \
            "$project_items" > "$priority_transitions"

          updated=0
          while IFS=$'\t' read -r item_id issue_number old_status desired; do
            [ -n "$item_id" ] || continue
            case "$desired" in
              Triage) option_id="$triage_id" ;;
              Confirmed) option_id="$confirmed_id" ;;
              Fixing) option_id="$fixing_id" ;;
              Verification) option_id="$verification_id" ;;
              Done) option_id="$done_id" ;;
              Deferred) option_id="$deferred_id" ;;
              *) continue ;;
            esac
            gh project item-edit \
              --id "$item_id" \
              --project-id "$project_id" \
              --field-id "$status_field_id" \
              --single-select-option-id "$option_id" > /dev/null
            updated=$((updated + 1))
          done < "$transitions"

          echo "Deterministic status updates: $updated"

          priority_updated=0
          while IFS=$'\t' read -r item_id issue_number old_priority desired_priority; do
            [ -n "$item_id" ] || continue
            case "$desired_priority" in
              P0) option_id="$priority_p0_id" ;;
              P1) option_id="$priority_p1_id" ;;
              P2) option_id="$priority_p2_id" ;;
              UNSET)
                gh project item-edit \
                  --id "$item_id" \
                  --project-id "$project_id" \
                  --field-id "$priority_field_id" \
                  --clear > /dev/null
                priority_updated=$((priority_updated + 1))
                continue
                ;;
              *) continue ;;
            esac
            gh project item-edit \
              --id "$item_id" \
              --project-id "$project_id" \
              --field-id "$priority_field_id" \
              --single-select-option-id "$option_id" > /dev/null
            priority_updated=$((priority_updated + 1))
          done < "$priority_transitions"

          echo "Priority updates: $priority_updated"
