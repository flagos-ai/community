name: Sync FlagOS 2.2 issues to release quality project

on:
  schedule:
    # Avoid the top of the hour, when GitHub Actions is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagos-2.2-project-sync
  cancel-in-progress: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TEAMMEMBER_TOKEN }}
      PROJECT_NUMBER: "9"
      PROJECT_OWNER: flagos-ai

    steps:
      - name: Add missing RC issues to the project
        shell: bash
        run: |
          set -euo pipefail

          all_issues="$RUNNER_TEMP/flagos-2.2-issues.txt"
          project_items="$RUNNER_TEMP/flagos-2.2-project-items.json"
          active_project_issues="$RUNNER_TEMP/flagos-2.2-active-project-issues.txt"
          archived_project_issues="$RUNNER_TEMP/flagos-2.2-archived-project-issues.tsv"
          missing_issues="$RUNNER_TEMP/missing-issues.txt"
          stale_issues="$RUNNER_TEMP/stale-issues.tsv"
          stale_deleted_items="$RUNNER_TEMP/stale-deleted-items.txt"
          : > "$all_issues"
          : > "$stale_deleted_items"

          for label in flagos2.2-rc0 flagos2.2-rc1 flagos2.2-rc2; do
            for state in open closed; do
              gh search issues \
                --owner "$PROJECT_OWNER" \
                --label "$label" \
                --state "$state" \
                --limit 1000 \
                --json url \
                --jq '.[].url' >> "$all_issues"
            done
          done

          sort -u -o "$all_issues" "$all_issues"

          project_query='query($owner:String!,$number:Int!){organization(login:$owner){projectV2(number:$number){items(first:100,archivedStates:[ARCHIVED,NOT_ARCHIVED]){nodes{id isArchived content{__typename ... on Issue{url}}}}}}}'
          gh api graphql -f query="$project_query" \
            -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" > "$project_items"

          jq -r '
            .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue" and .isArchived == false)
            | .content.url' "$project_items" | sort -u > "$active_project_issues"
          jq -r '
            .data.organization.projectV2.items.nodes[]
            | select(.content.__typename == "Issue" and .isArchived == true)
            | [.content.url, .id] | @tsv' "$project_items" \
            | sort -u > "$archived_project_issues"
          jq -r '
            .data.organization.projectV2.items.nodes[]
            | select(.isArchived == false and (.content == null or .content.__typename == "Issue"))
            | [.id, (.content.url // "")] | @tsv' "$project_items" \
            > "$stale_issues"

          comm -23 "$all_issues" "$active_project_issues" > "$missing_issues"

          added=0
          reactivated=0
          while IFS= read -r issue_url; do
            [ -n "$issue_url" ] || continue
            archived_id=$(awk -F '\t' -v url="$issue_url" '$1 == url {print $2; exit}' "$archived_project_issues")
            if [ -n "$archived_id" ]; then
              gh project item-archive "$PROJECT_NUMBER" \
                --owner "$PROJECT_OWNER" --id "$archived_id" --undo > /dev/null
              reactivated=$((reactivated + 1))
            else
              gh project item-add "$PROJECT_NUMBER" \
                --owner "$PROJECT_OWNER" \
                --url "$issue_url" > /dev/null
              added=$((added + 1))
            fi
          done < "$missing_issues"

          archived=0
          while IFS=$'\t' read -r item_id issue_url; do
            if [ -z "$issue_url" ]; then
              echo "$item_id" >> "$stale_deleted_items"
            elif ! grep -Fxq "$issue_url" "$all_issues"; then
              gh project item-archive "$PROJECT_NUMBER" \
                --owner "$PROJECT_OWNER" --id "$item_id" > /dev/null
              archived=$((archived + 1))
            fi
          done < "$stale_issues"
          while IFS= read -r item_id; do
            [ -n "$item_id" ] || continue
            gh project item-archive "$PROJECT_NUMBER" \
              --owner "$PROJECT_OWNER" --id "$item_id" > /dev/null
            archived=$((archived + 1))
          done < "$stale_deleted_items"

          echo "Matched $(wc -l < "$all_issues" | tr -d ' ') issues; added $added; reactivated $reactivated; archived $archived."

      - name: Reconcile deterministic project status
        shell: bash
        run: |
          set -euo pipefail

          project_id=$(gh project view "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json --jq '.id')
          status_field_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .id')
          triage_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Triage") | .id')
          confirmed_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Confirmed") | .id')
          done_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id')
          deferred_id=$(gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" --format json \
            --jq '.fields[] | select(.name == "Status") | .options[] | select(.name == "Deferred") | .id')

          query='query($owner:String!,$number:Int!){organization(login:$owner){projectV2(number:$number){items(first:100){nodes{id content{... on Issue{number state stateReason assignees(first:20){nodes{login}}}} fieldValues(first:30){nodes{... on ProjectV2ItemFieldSingleSelectValue{name field{... on ProjectV2SingleSelectField{name}}}}}}}}}}'
          project_items="$RUNNER_TEMP/flagos-2.2-project-items.json"
          transitions="$RUNNER_TEMP/flagos-2.2-status-transitions.tsv"
          gh api graphql -f query="$query" \
            -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" > "$project_items"

          jq -r \
            '.data.organization.projectV2.items.nodes[]
            | select(.content != null)
            | {id, number: .content.number, state: .content.state,
               reason: .content.stateReason,
               assignees: [.content.assignees.nodes[].login],
               status: ([.fieldValues.nodes[]
                         | select(.field.name == "Status") | .name][0] // "UNSET")}
            | (.desired = (
                if .state == "CLOSED" and .reason == "NOT_PLANNED" then "Deferred"
                elif .state == "CLOSED" and .reason == "COMPLETED" then "Done"
                elif .state == "OPEN" and (.assignees | length) == 0 then "Triage"
                elif .state == "OPEN" and .reason == "REOPENED" then
                  (if (.assignees | length) == 0 then "Triage" else "Confirmed" end)
                elif .state == "OPEN" and .status == "UNSET" then "Confirmed"
                else .status
                end))
            | select(.desired != .status)
            | [.id, .number, .status, .desired] | @tsv' \
            "$project_items" > "$transitions"

          updated=0
          while IFS=$'\t' read -r item_id issue_number old_status desired; do
            [ -n "$item_id" ] || continue
            case "$desired" in
              Triage) option_id="$triage_id" ;;
              Confirmed) option_id="$confirmed_id" ;;
              Done) option_id="$done_id" ;;
              Deferred) option_id="$deferred_id" ;;
              *) continue ;;
            esac
            gh project item-edit \
              --id "$item_id" \
              --project-id "$project_id" \
              --field-id "$status_field_id" \
              --single-select-option-id "$option_id" > /dev/null
            updated=$((updated + 1))
          done < "$transitions"

          echo "Deterministic status updates: $updated"
